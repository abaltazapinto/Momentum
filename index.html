<!doctype html>
<html lang="pt-PT">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta
            name="description"
            content="Momentum — organiza o próximo passo."
        >
        <script>
            try {
                const savedTheme = localStorage.getItem("momentum-theme")

                if (savedTheme === "dark") {
                    document.documentElement.dataset.theme = "dark"
                }
            } catch (error) {
                // The light theme remains available when storage is blocked.
            }
        </script>
        <title>Momentum</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300&display=swap" rel="stylesheet">
        <link rel="icon" type="image/svg+xml" href="/momentum-logo.svg">
        <link rel="icon" href="/favicon.ico" sizes="any">
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
        <link rel="manifest" href="/site.webmanifest">
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <main class="container">
            <header class="app-header">
                <div class="eyebrow">DAILY OS</div>
                <h1>Organize my day</h1>
                <p id="app-tagline">Entra na tua conta para organizar o teu dia.</p>
                <button
                    type="button"
                    id="theme-toggle"
                    class="theme-toggle"
                    aria-label="Switch to dark mode"
                >
                    <svg class="lucide theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"></path>
                    </svg>
                    <svg class="lucide theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2"></path>
                        <path d="M12 20v2"></path>
                        <path d="m4.93 4.93 1.41 1.41"></path>
                        <path d="m17.66 17.66 1.41 1.41"></path>
                        <path d="M2 12h2"></path>
                        <path d="M20 12h2"></path>
                        <path d="m6.34 17.66-1.41 1.41"></path>
                        <path d="m19.07 4.93-1.41 1.41"></path>
                    </svg>
                </button>
            </header>

            <section id="entry-view" aria-label="Iniciar sessão">
            <form id="auth-form" class="task-form">
                <h2 class="auth-title">Entra no Momentum</h2>
                <p id="auth-status" class="auth-status" role="status">A preparar a entrada…</p>
                <label for="auth-email">Email</label>
                <input type="email" id="auth-email" placeholder="Email" autocomplete="email" required>
                <label for="auth-password">Palavra-passe</label>
                <input type="password" id="auth-password" placeholder="Palavra-passe (mín. 6 caracteres)" autocomplete="current-password" minlength="6" required>
                <div class="email-login-actions">
                    <button type="submit" id="auth-submit-button" disabled>Entrar</button>
                    <button type="submit" id="auth-create-button" disabled>Criar conta</button>
                </div>
                <div class="social-login-grid">
                    <button type="button" id="google-sign-in-button" disabled><span class="social-mark">G</span> Google</button>
                    <button type="button" id="facebook-sign-in-button" disabled><span class="social-mark">f</span> Facebook</button>
                    <button type="button" id="github-sign-in-button" disabled><span class="social-mark">⌘</span> GitHub</button>
                </div>
                <button type="button" id="existing-sign-in-button" hidden>Entrar na conta existente</button>
            </form>
            </section>

            <section id="workspace-view" aria-label="O teu dia" hidden>
            <div class="account-bar"><span id="account-label"></span><button type="button" id="sign-out-button">Sair</button></div>
            <section class="daily-panel" aria-labelledby="daily-panel-title">
                <div><span class="eyebrow">HOJE</span><h2 id="daily-panel-title">O teu dia, num olhar</h2></div>
                <p id="daily-summary" class="daily-summary"></p>
            </section>

            <form id="task-form" class="task-form">
                <label for="task-input">Próximo passo</label>
                <input
                    type="text"
                    id="task-input"
                    name="task"
                    placeholder="O que precisa de ser feito?"
                    autocomplete="off"
                    required
                >
                <label><input type="checkbox" id="recurring-toggle"> Recorrente semanal</label>
                <label for="recurring-target" id="recurring-target-label" hidden>Vezes por semana</label>
                <input type="number" id="recurring-target" min="1" step="1" value="3" hidden>
                <button type="submit" id="add-task-button">Adicionar tarefa</button>
            </form>

            <p id="task-status" class="task-status" role="status" aria-live="polite"></p>

            <ul id="task-list" aria-label="Tarefas"></ul>
            <details class="storage-panel">
                <summary>Recuperação e cópias das tarefas</summary>
                <p>Recupera a lista antiga ou importa um ficheiro JSON para a tua conta.</p>
                <div class="storage-actions">
                    <button type="button" id="recover-tasks-button">Recuperar tarefas antigas</button>
                    <button type="button" id="export-tasks-button">Exportar cópia</button>
                    <button type="button" id="import-tasks-button">Importar cópia</button>
                    <button type="button" id="import-browser-tasks-button" hidden>Importar tarefas guardadas neste navegador</button>
                </div>
                <input type="file" id="import-tasks-file" accept=".json,application/json" hidden>
            </details>
            </section>
        </main>
        <script src="index.js" type="module"></script>
    </body>
</html>
